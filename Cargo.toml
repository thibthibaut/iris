[package]
name = "iris"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/iris-core"]

[dependencies]
iris-core = { path = "crates/iris-core" }
anyhow = "1"
axum = "0.8"
blake3 = "1"
bytemuck = "1"
chrono = { version = "0.4", features = ["serde"] }
comfy-table = "7"
clap = { version = "4", features = ["derive"] }
face_id = "0.4.1"
hdbscan = { version = "0.12.0", features = ["parallel"] }
image = "0.25.9"
indicatif = "0.18.4"
innr = "0.4.0"
imageproc = "0.25"
kamadak-exif = "0.6"
libvips = "2.0.0"
open_clip_inference = "0.4.0"
rayon = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "=0.1.9"
tokio = { version = "1", features = ["full", "net", "rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
chrono-tz = "0.10"
askama = "0.14"
rust-embed = "8"
futures-util = "0.3"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
